name: PHP Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PHP lint
        run: |
          for file in $(find . -type f -name "*.php" \
            ! -path "./vendor/*" \
            ! -path "./library/*" \
            ! -path "./sql/*"); do
            php -l "$file"
          done
